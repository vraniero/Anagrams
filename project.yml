name: Anagrams
options:
  bundleIdPrefix: com.ranierovirgilio
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9P2NQ693B3
    CODE_SIGN_STYLE: Automatic
packages:
  AnagramKit:
    path: Packages/AnagramKit
targets:
  Anagrams:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: AnagramKit
        product: AnagramModels
      - package: AnagramKit
        product: SpeechCapture
      - package: AnagramKit
        product: AnagramEngine
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Anagrams
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Anagrams listens to what you say to turn it into letter blocks.
        NSLocalNetworkUsageDescription: Anagrams talks to its speech server on your network.
        NSCameraUsageDescription: Anagrams reads written sentences with the camera so you can anagram them.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ranierovirgilio.anagrams
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
  AnagramsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [App/Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Anagrams
  AnagramsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Anagrams
schemes:
  Anagrams:
    build:
      targets:
        Anagrams: all
    test:
      targets:
        - AnagramsTests
        - AnagramsUITests
        - package: AnagramKit/AnagramEngineTests
        - package: AnagramKit/SpeechCaptureTests
