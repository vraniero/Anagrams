name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test \
            -project Anagrams.xcodeproj \
            -scheme Anagrams \
            -destination "id=$SIM_ID" \
            -skip-testing:AnagramsUITests \
            CODE_SIGNING_ALLOWED=NO
